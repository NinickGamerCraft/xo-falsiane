<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1f4d" />
    <title>Sem conexão | Xô, falsiane!</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #eef5ff;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background:
          linear-gradient(rgba(4, 9, 20, .72), rgba(4, 9, 20, .88)),
          repeating-conic-gradient(#07142e 0 25%, #0b1e43 0 50%) 50% / 48px 48px;
      }
      main {
        width: min(560px, 100%);
        padding: 32px;
        border: 1px solid #3f79db;
        border-radius: 24px;
        background: rgba(7, 15, 33, .92);
        box-shadow: 0 24px 70px rgba(0,0,0,.45);
        text-align: center;
      }
      strong { color: #6aa7ff; letter-spacing: .12em; }
      h1 { margin: 12px 0; font-size: clamp(30px, 7vw, 48px); }
      p { color: #c8d7ef; line-height: 1.6; }
      button, a {
        display: inline-block;
        margin: 8px;
        padding: 12px 18px;
        border: 0;
        border-radius: 12px;
        color: white;
        background: #2e75e8;
        font: inherit;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <strong>MODO OFFLINE</strong>
      <h1>Sem conexão no momento</h1>
      <p>
        As páginas e os assets que já foram carregados podem continuar disponíveis.
        A análise por IA e o ranking online precisam de internet.
      </p>
      <button onclick="location.reload()">Tentar novamente</button>
      <a href="/jogo">Abrir Space News</a>

  </body>
</html>
