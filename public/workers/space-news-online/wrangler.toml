name = "space-news-online"
main = "src/index.ts"
compatibility_date = "2026-06-25"

# Troque para o domínio do seu site depois do deploy.
# Em dev, deixe * para testar localhost.
[vars]
ALLOWED_ORIGIN = "*"

[[durable_objects.bindings]]
name = "GAME_ROOM"
